name: Mocked tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm install --prefix /tmp/growth-browser-tools playwright@1.56.1
      - run: /tmp/growth-browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - run: |
          node scripts/test-m3-browser.mjs
          node scripts/test-public-web-browser.mjs
          node scripts/test-pilot-browser.mjs
        env:
          PLAYWRIGHT_MODULE: /tmp/growth-browser-tools/node_modules/playwright/index.mjs
